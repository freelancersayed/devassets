name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier spinning down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    name: Ping Render Python API
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Endpoint
        run: |
          echo "Pinging DevAssets Python API..."
          curl -s -f -m 30 https://devassets-python-api.onrender.com/ || echo "Ping attempted."
